[project]
name = "AnimePlanet"
version = "0.1.0"
description = "Anime app that provides recommendations, animes, analysis based off MAL profile"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "apscheduler>=3.11.3",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "celery>=5.6.3",
    "fastapi>=0.141.1",
    "httpx>=0.28.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.13.0",
    "redis>=8.1.0",
    "resend>=2.36.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "structlog>=26.1.0",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
    "pytest-mock>=3.14.0",
    "httpx2>=2.12.0",
    "ruff>=0.17.0",
    "jupyter>=1.1.1",
    "ipykernel>=7.4.0",
    "pandas>=3.0.6",
]

[tool.ruff]
line-length = 100
extend-exclude = ["analysis"]  # exploratory notebooks and probe data, not application code

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # pycodestyle, pyflakes, import order, pyupgrade, bugbear
ignore = [
    "E501",  # line length is handled by `ruff format`
    "B008",  # FastAPI uses Depends()/Query() calls in argument defaults
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
