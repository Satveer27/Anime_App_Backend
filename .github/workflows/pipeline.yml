# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch, or else costly
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:


    
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
# The default token can be read/write; nothing here needs more than reading the repository.
permissions:
  contents: read

jobs:

  startup-and-test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    env:
      DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379/0
      REDIS_BROKER_URL: redis://localhost:6379/1
      REDIS_BACKEND_URL: redis://localhost:6379/2
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      FRONTEND_URL: http://localhost:3000
      ENVIRONMENT: Testing
      TEST_DB_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db

    services:
      postgres-db-test:
        image: postgres:15.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5 
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install dependencies for python 
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install uv 
          uv sync --group dev
      
      # Lint and format checks (fail fast, before migrations and tests)
      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      # Alembic migration
      - name: run alembic migrations
        run: uv run alembic upgrade head

      # Alembic migration checks
      - name: check for missing migrations
        run: uv run alembic check

      # Run tests
      - name: Run tests
        run: uv run pytest --disable-warnings -q
      
  dockerfile-build:
    runs-on: ubuntu-latest
    needs: startup-and-test
    env:
      DB_URL: postgresql+asyncpg://anime_user:anime_password@db:5432/anime_database
      REDIS_URL: redis://redis:6379/0
      REDIS_BROKER_URL: redis://redis:6379/1
      REDIS_BACKEND_URL: redis://redis:6379/2
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      FRONTEND_URL: http://localhost:3000
      ENVIRONMENT: Testing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate .env.dev for docker compose
        run: |
          cat <<EOF > .env.dev
          DB_URL=${DB_URL}
          REDIS_URL=${REDIS_URL}
          REDIS_BROKER_URL=${REDIS_BROKER_URL}
          REDIS_BACKEND_URL=${REDIS_BACKEND_URL}
          JWT_SECRET=${JWT_SECRET}
          JWT_ALGORITHM=${JWT_ALGORITHM}
          ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
          REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS}
          RESEND_API_KEY=${RESEND_API_KEY}
          FRONTEND_URL=${FRONTEND_URL}
          ENVIRONMENT=${ENVIRONMENT}
          EOF

      - name: Start app via docker-compose
        run: docker compose up -d --build

      - name: Wait and check health endpoint
        run: |
          for i in $(seq 1 10); do
            if curl --fail http://localhost:8000/api/v1/health; then
              echo "App is healthy"
              exit 0
            fi
            echo "Not ready yet, retrying..."
            sleep 3
          done
          echo "App failed to become healthy in time"
          exit 1
      
      - name: show logs on failure
        if: failure()
        run: docker compose logs
      
      - name: tear down
        if: always()
        run: docker compose down

  # --- Deployment: only for a PUSH to main, never for a pull request ----------------------------
  # changes : which parts of the push matter? airflow/ files, and Alembic files
  # migrate : only if an Alembic file changed, bring RDS to the latest revision
  # deploy  : only if something under airflow/ changed, and not if migrate failed, recreate Airflow
  # If a migration fails, fix it and re-run the failed job: the next push will NOT retry it, because
  # no Alembic file will have changed by then.
  # migrate and deploy use separate concurrency groups on purpose: GitHub keeps only one PENDING job
  # per group, so a shared group would let a queued deploy cancel a queued migration.
  # NOTE: the app code (app/) is baked into the Airflow image, but a change to it does NOT redeploy
  # Airflow by itself. After a fix under app/, redeploy by hand: on the server, in the repo,
  #   git pull --ff-only && bash airflow/deploy.sh
  # Secrets (Settings > Secrets and variables > Actions): ORACLE_HOST, ORACLE_USER, ORACLE_SSH_KEY,
  # ORACLE_KNOWN_HOSTS (the server's host key line, so the runner can verify it is the right server).

  migrate:
    needs: [startup-and-test, dockerfile-build, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.alembic == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: migrate-production
      cancel-in-progress: false # never cut a running migration short; the next one waits

    steps:
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Pull main and migrate RDS on the Oracle box
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
        run: |
          # Whatever branch the server is on, it ends up on main at the newest commit, then migrates.
          ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
              "$SSH_USER@$HOST" \
              'set -euo pipefail
               cd ~/Anime_App_Backend
               git fetch origin main
               git checkout main
               git pull --ff-only origin main
               bash airflow/migrate.sh'

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts

  changes:
    # Only the airflow/ folder triggers a redeploy (DAGs, Dockerfile.prod, compose files, scripts).
    # Changes elsewhere (app/, alembic/, dependencies) do not: migrations still run on every push,
    # and a bug fix in app/ is redeployed by hand, which saves runner minutes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      airflow: ${{ steps.diff.outputs.airflow }}
      alembic: ${{ steps.diff.outputs.alembic }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare with the previous main
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # No usable previous commit (first push, force push): deploy to be safe
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "airflow=true" >> "$GITHUB_OUTPUT"
            echo "alembic=true" >> "$GITHUB_OUTPUT"
            echo "No previous commit to compare with: migrating and deploying"
            exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "$AFTER")
          echo "Changed files:"
          echo "$changed"
          if echo "$changed" | grep -Eq '^airflow/'; then
            echo "airflow=true" >> "$GITHUB_OUTPUT"
          else
            echo "airflow=false" >> "$GITHUB_OUTPUT"
            echo "Nothing under airflow/ changed: not redeploying Airflow"
          fi
          if echo "$changed" | grep -Eq '^(alembic/|alembic\.ini$)'; then
            echo "alembic=true" >> "$GITHUB_OUTPUT"
          else
            echo "alembic=false" >> "$GITHUB_OUTPUT"
            echo "No Alembic file changed: not migrating"
          fi

  deploy:
    # Runs only if airflow/ changed, the checks passed, and the migration did not fail. The migration
    # may be skipped (no Alembic change). A skipped dependency would normally skip this job too, so
    # the conditions are spelled out; !cancelled() replaces the implicit success() check.
    needs: [startup-and-test, dockerfile-build, migrate, changes]
    if: >-
      !cancelled()
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.startup-and-test.result == 'success'
      && needs.dockerfile-build.result == 'success'
      && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
      && needs.changes.outputs.airflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false # never cut a running deploy short; the next one waits

    steps:
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Pull main and recreate Airflow on the Oracle box
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          SSH_USER: ${{ secrets.ORACLE_USER }}
        run: |
          # Pulls again (a no-op right after migrate, but needed when this job is re-run alone),
          # then deploy.sh: guard against an active DAG run, build, recreate, wait until healthy.
          ssh -i ~/.ssh/deploy_key \
              -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
              "$SSH_USER@$HOST" \
              'set -euo pipefail
               cd ~/Anime_App_Backend
               git fetch origin main
               git checkout main
               git pull --ff-only origin main
               bash airflow/deploy.sh'

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
